<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="opt-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#542004"/>
      <stop offset="55%" stop-color="#2c0f02"/>
      <stop offset="100%" stop-color="#0c0401"/>
    </radialGradient>
    <linearGradient id="opt-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="opt-boost-arc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <filter id="opt-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Metallic Squircle Container -->
  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#opt-bg)" stroke="#f97316" stroke-width="2.5" stroke-opacity="0.9"/>
  <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Core Radiant Flare -->
  <circle cx="64" cy="68" r="34" fill="#f97316" opacity="0.2" filter="url(#opt-glow)"/>

  <!-- Background Inactive Gauge Arc -->
  <path d="M 28 88 A 44 44 0 1 1 100 88" fill="none" stroke="#260f04" stroke-width="10" stroke-linecap="round"/>

  <!-- Turbo Boost High-RPM Speedometer Arc with Heavy Glow -->
  <path d="M 46 33 A 44 44 0 0 1 100 88" fill="none" stroke="url(#opt-boost-arc)" stroke-width="10" stroke-linecap="round" filter="url(#opt-glow)"/>

  <!-- Prominent Speed Ticks -->
  <line x1="32" y1="80" x2="40" y2="76" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="54" x2="43" y2="57" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="30" x2="64" y2="40" stroke="#fef08a" stroke-width="4" stroke-linecap="round" filter="url(#opt-glow)"/>
  <line x1="93" y1="54" x2="85" y2="57" stroke="#ff0055" stroke-width="4" stroke-linecap="round" filter="url(#opt-glow)"/>
  <line x1="96" y1="80" x2="88" y2="76" stroke="#ff0055" stroke-width="4" stroke-linecap="round" filter="url(#opt-glow)"/>

  <!-- Gauge Center Pivot -->
  <circle cx="64" cy="80" r="14" fill="#140602" stroke="url(#opt-fire)" stroke-width="3"/>

  <!-- Max Performance Needle -->
  <g filter="url(#opt-glow)">
    <line x1="64" y1="80" x2="94" y2="44" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="64" cy="80" r="5" fill="#fef08a"/>
  </g>

  <!-- Dynamic Turbo Lightning Bolt -->
  <g filter="url(#opt-glow)">
    <polygon points="66,66 58,80 65,80 60,96 74,78 67,78" fill="url(#opt-fire)"/>
  </g>
</svg>
