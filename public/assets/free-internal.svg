<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="int-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="55%" stop-color="#1e0538"/>
      <stop offset="100%" stop-color="#090214"/>
    </radialGradient>
    <linearGradient id="int-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="int-core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="int-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Metallic Squircle Container -->
  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#int-bg)" stroke="#c084fc" stroke-width="2.5" stroke-opacity="0.9"/>
  <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#f472b6" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Glowing Core Aura -->
  <circle cx="64" cy="64" r="34" fill="#a855f7" opacity="0.3" filter="url(#int-glow)"/>

  <!-- Microchip Outer Contact Pins (Bold & Bright) -->
  <!-- Left Pins -->
  <rect x="16" y="42" width="12" height="6" rx="2" fill="#f472b6" filter="url(#int-glow)"/>
  <rect x="16" y="54" width="12" height="6" rx="2" fill="#f472b6" filter="url(#int-glow)"/>
  <rect x="16" y="66" width="12" height="6" rx="2" fill="#f472b6" filter="url(#int-glow)"/>
  <rect x="16" y="78" width="12" height="6" rx="2" fill="#f472b6" filter="url(#int-glow)"/>

  <!-- Right Pins -->
  <rect x="100" y="42" width="12" height="6" rx="2" fill="#f472b6" filter="url(#int-glow)"/>
  <rect x="100" y="54" width="12" height="6" rx="2" fill="#f472b6" filter="url(#int-glow)"/>
  <rect x="100" y="66" width="12" height="6" rx="2" fill="#f472b6" filter="url(#int-glow)"/>
  <rect x="100" y="78" width="12" height="6" rx="2" fill="#f472b6" filter="url(#int-glow)"/>

  <!-- Top & Bottom Bus Lines -->
  <path d="M 44 20 L 44 32 M 64 16 L 64 32 M 84 20 L 84 32" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
  <path d="M 44 108 L 44 96 M 64 112 L 64 96 M 84 108 L 84 96" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Silicon Die Housing -->
  <rect x="30" y="30" width="68" height="68" rx="16" fill="#140424" stroke="url(#int-neon)" stroke-width="3" filter="url(#int-glow)"/>
  <rect x="34" y="34" width="60" height="60" rx="13" fill="none" stroke="#e879f9" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Central Processor Die Core -->
  <g filter="url(#int-glow)">
    <rect x="44" y="44" width="40" height="40" rx="9" fill="url(#int-core-grad)"/>
    <rect x="48" y="48" width="32" height="32" rx="6" fill="#1a0530"/>
    
    <!-- Bold High-Tech Processor Core Symbol (Circuit Cross & Nodes) -->
    <path d="M 64 52 L 64 76 M 52 64 L 76 64" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="64" cy="64" r="5" fill="#f472b6"/>
    <circle cx="64" cy="52" r="3" fill="#ffffff"/>
    <circle cx="64" cy="76" r="3" fill="#ffffff"/>
    <circle cx="52" cy="64" r="3" fill="#ffffff"/>
    <circle cx="76" cy="64" r="3" fill="#ffffff"/>
  </g>
</svg>
